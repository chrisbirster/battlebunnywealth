name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tag commit to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit already merged into main."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build frontend
        working-directory: web
        run: npm install && npm run build
      - name: Test
        run: go test ./...
      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/battlebunnywealth-linux-amd64 ./cmd/battlebunnywealth
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/battlebunnywealth-darwin-arm64 ./cmd/battlebunnywealth
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/battlebunnywealth-windows-amd64.exe ./cmd/battlebunnywealth
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
