name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Test Warren Wars simulation
        working-directory: web
        run: npm run test:arena
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Build testnet package
        run: go build ./internal/testnet
      - name: Compile testnet tests
        run: go test ./internal/testnet -run '^$'
      - name: Test testnet genesis and protocol commitment
        run: go test ./internal/testnet -run '^TestGenesisCommitsCARROTPolicy$'
      - name: Test testnet voting, round change, and fault rejection
        run: go test ./internal/testnet -run 'Test(FourValidator|TwoOffline|InvalidSignature|HundredFake|DuplicateVote|ProposalRejects|RoundChange|ValidatorCannotOmit|RoundProgress|ProposerEquivocation|ProposalAndVoteEquivocation)'
      - name: Test testnet transport and recovery
        run: go test ./internal/testnet -run 'Test(Activation|PeerAllowlist|HTTPStatus|P256|SmokeCluster|StoreRestart|DirectIngress|SyncFromWithStore|StoreIgnoresStale)'
      - name: Gate replicated TEST-CARROT and transition state
        run: go test ./internal/publictestnet
      - name: Gate live evidence and review-freeze invariants
        run: go test ./internal/publictestnet -run 'Test(LiveEvidence|BuildReviewFreeze|ReviewFreeze)'
      - name: Test Go
        run: go test ./...
      - name: Smoke Proof-of-Play simulator
        run: go run ./cmd/pop-sim -scenario smoke -seed 1 -format json > /tmp/pop-sim-smoke.json
      - name: Gate four-phone bootstrap against a 100-phone farm
        run: go run ./cmd/pop-bootstrap-sim -phones 100 -gate
      - name: Smoke permissioned testnet cluster
        run: go run ./cmd/pop-cluster -blocks 20
      - name: Check CARROT protocol invariants
        run: go run ./cmd/carrot-spec -check
      - name: Gate adversarial public testnet
        run: go run ./cmd/pop-public-smoke -attackers 100 -gate
      - name: Gate controlled transitions and long-running public testnet
        run: go run ./cmd/pop-soak -blocks 1100 -gate > /tmp/pop-soak.json
      - name: Gate round changes, message disorder, partitions, and restart replay
        run: go run ./cmd/pop-round-chaos -blocks 240 -seed 42 -gate > /tmp/pop-round-chaos.json
      - name: Vet Go
        run: go vet ./...
      - name: Build server
        run: go build ./cmd/battlebunnywealth
      - name: Build simulator
        run: go build ./cmd/pop-sim
      - name: Build bootstrap simulator
        run: go build ./cmd/pop-bootstrap-sim
      - name: Build testnet node
        run: go build ./cmd/pop-node
      - name: Build testnet cluster harness
        run: go build ./cmd/pop-cluster
      - name: Build CARROT spec tool
        run: go build ./cmd/carrot-spec
      - name: Build TEST-CARROT wallet tool
        run: go build ./cmd/carrot-wallet
      - name: Build public-testnet adversarial harness
        run: go build ./cmd/pop-public-smoke
      - name: Build public-testnet soak harness
        run: go build ./cmd/pop-soak
      - name: Build round-change chaos harness
        run: go build ./cmd/pop-round-chaos
      - name: Build checkpoint comparison tool
        run: go build ./cmd/pop-checkpoint-compare
      - name: Build distributed evidence collector
        run: go build ./cmd/pop-network-evidence
      - name: Build live evidence collector
        run: go build ./cmd/pop-live-evidence
      - name: Build review-freeze tool
        run: go build ./cmd/pop-review-freeze
      - name: Build public-testnet node image
        run: docker build -f Dockerfile.pop-node -t battlebunnywealth-pop-node:ci .
