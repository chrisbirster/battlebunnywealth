name: Deploy Fly Testnet Node

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Existing Fly app name for this node
        required: true
        type: string
      region:
        description: Fly region for this node
        required: true
        type: choice
        options:
          - iad
          - ord
          - dfw
          - lax

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require merged dev revision
        run: test "$GITHUB_REF" = "refs/heads/dev"
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify Fly access and app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ inputs.app_name }}
        run: |
          test -n "$FLY_API_TOKEN"
          flyctl status -a "$FLY_APP"
      - name: Deploy one Fly testnet node
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ inputs.app_name }}
          REGION: ${{ inputs.region }}
        run: |
          flyctl deploy . \
            --remote-only \
            --ha=false \
            --app "$FLY_APP" \
            --config "deploy/fly/fly.${REGION}.toml" \
            --dockerfile Dockerfile.pop-node
      - name: Record deployed machine and image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ inputs.app_name }}
        run: |
          flyctl status -a "$FLY_APP" --json > fly-status.json
          jq -r '.Machines[] | [.id, .region, .state, .config.image] | @tsv' fly-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: fly-deploy-${{ inputs.region }}-${{ github.sha }}
          path: fly-status.json
          retention-days: 90
