version: '3'

tasks:
  setup:
    desc: Install frontend dependencies
    dir: web
    cmds:
      - npm install

  dev:web:
    desc: Start the Vite development server
    dir: web
    cmds:
      - npm run dev

  dev:server:
    desc: Start the Go API and embedded-SPA server
    cmds:
      - go run ./cmd/battlebunnywealth

  sim:
    desc: Run the baseline Proof-of-Play simulation
    cmds:
      - go run ./cmd/pop-sim -scenario baseline -seed 42 -format json

  sim:all:
    desc: Run all built-in Proof-of-Play scenarios as CSV
    cmds:
      - go run ./cmd/pop-sim -scenario all -seed 42 -format csv

  sim:sweep:
    desc: Sweep real-phone attacker population sizes
    cmds:
      - go run ./cmd/pop-sim -scenario attack-sweep -seed 42 -format csv

  sim:bootstrap:
    desc: Model a 100-real-phone farm against the four-phone bootstrap
    cmds:
      - go run ./cmd/pop-bootstrap-sim -phones 100

  carrot:check:
    desc: Validate frozen CARROT supply and issuance invariants
    cmds:
      - go run ./cmd/carrot-spec -check

  carrot:report:
    desc: Print the executable CARROT policy and height-1 supply report
    cmds:
      - go run ./cmd/carrot-spec -height 1

  testnet:keygen:
    desc: Generate a local permissioned-testnet node key
    cmds:
      - mkdir -p ./data/testnet/node-a
      - go run ./cmd/pop-node -keygen ./data/testnet/node-a/node.key

  testnet:smoke:
    desc: Finalize 20 blocks across five independent local testnet engines
    cmds:
      - go run ./cmd/pop-cluster -blocks 20
      - go run ./cmd/pop-bootstrap-sim -phones 100 -gate

  testnet:public-smoke:
    desc: Exercise public discovery, signed TEST-CARROT, and 100-attacker containment gates
    cmds:
      - go run ./cmd/pop-public-smoke -attackers 100 -gate

  testnet:soak:
    desc: Run the 1,100-block validator/upgrade/restart public-testnet soak gate
    cmds:
      - go run ./cmd/pop-soak -blocks 1100 -gate

  testnet:round-chaos:
    desc: Run deterministic round-change, reordering, duplicate, partition, clock-skew, and restart chaos
    cmds:
      - go run ./cmd/pop-round-chaos -blocks 240 -seed 42 -gate

  testnet:checkpoint-compare:
    desc: Compare checkpoints from independent running operators; pass URL1 and URL2 variables
    cmds:
      - go run ./cmd/pop-checkpoint-compare -url "{{.URL1}}" -url "{{.URL2}}"
    requires:
      vars: [URL1, URL2]

  testnet:evidence:
    desc: Collect a one-shot availability/checkpoint report from two operators
    cmds:
      - go run ./cmd/pop-network-evidence -url "{{.URL1}}" -url "{{.URL2}}" -gate
    requires:
      vars: [URL1, URL2]

  testnet:live-evidence:
    desc: Collect a retained Fly-only evidence window across four regions
    cmds:
      - go run ./cmd/pop-live-evidence -operators "{{.OPERATORS}}" -repo-sha "{{.REPO_SHA}}" -samples 12 -interval 5m -min-providers 1 -min-regions 4 -min-samples-per-operator 12 -min-window 30m -gate -out live-evidence.json
    requires:
      vars: [OPERATORS, REPO_SHA]

  fly:bootstrap-config:
    desc: Generate one canonical genesis and four Fly node configs from public validator/node manifests
    cmds:
      - go run ./cmd/pop-bootstrap-config -validators "{{.VALIDATORS}}" -nodes "{{.NODES}}" -out "{{.OUT}}"
    requires:
      vars: [VALIDATORS, NODES, OUT]

  fly:deploy:
    desc: Deploy one existing Fly testnet app; REGION is iad, ord, dfw, or lax
    cmds:
      - fly deploy . --remote-only --ha=false -a "{{.APP}}" -c "deploy/fly/fly.{{.REGION}}.toml" --dockerfile Dockerfile.pop-node
    requires:
      vars: [APP, REGION]

  fly:topology-evidence:
    desc: Validate and hash four captured Fly machine inventories
    cmds:
      - go run ./cmd/pop-fly-topology -inventory "{{.INVENTORY}}" -repo-sha "{{.REPO_SHA}}" -out fly-topology.json
    requires:
      vars: [INVENTORY, REPO_SHA]

  review:freeze:
    desc: Freeze validated live evidence against an exact merged dev SHA and deployed image digest
    cmds:
      - go run ./cmd/pop-review-freeze -repo-sha "{{.REPO_SHA}}" -image-digest "{{.IMAGE_DIGEST}}" -evidence "{{.EVIDENCE}}" -out review-freeze.json
    requires:
      vars: [REPO_SHA, IMAGE_DIGEST, EVIDENCE]

  build:web:
    desc: Build the Solid SPA into web/dist
    dir: web
    cmds:
      - npm run build

  build:
    desc: Build the production frontend and Go binaries
    deps: [build:web]
    cmds:
      - go build -o ./battlebunnywealth ./cmd/battlebunnywealth
      - go build -o ./pop-sim ./cmd/pop-sim
      - go build -o ./pop-bootstrap-sim ./cmd/pop-bootstrap-sim
      - go build -o ./pop-bootstrap-config ./cmd/pop-bootstrap-config
      - go build -o ./pop-fly-topology ./cmd/pop-fly-topology
      - go build -o ./pop-node ./cmd/pop-node
      - go build -o ./pop-cluster ./cmd/pop-cluster
      - go build -o ./carrot-spec ./cmd/carrot-spec
      - go build -o ./carrot-wallet ./cmd/carrot-wallet
      - go build -o ./pop-public-smoke ./cmd/pop-public-smoke
      - go build -o ./pop-soak ./cmd/pop-soak
      - go build -o ./pop-round-chaos ./cmd/pop-round-chaos
      - go build -o ./pop-checkpoint-compare ./cmd/pop-checkpoint-compare
      - go build -o ./pop-network-evidence ./cmd/pop-network-evidence
      - go build -o ./pop-live-evidence ./cmd/pop-live-evidence
      - go build -o ./pop-review-freeze ./cmd/pop-review-freeze

  test:
    desc: Run frontend typechecking and Go tests
    cmds:
      - cd web && npm run typecheck
      - go test ./...

  ci:
    desc: Run the local CI equivalent
    deps: [build:web]
    cmds:
      - cd web && npm run typecheck
      - go test ./...
      - go run ./cmd/pop-sim -scenario smoke -seed 1 -format json > /tmp/pop-sim-smoke.json
      - go run ./cmd/pop-bootstrap-sim -phones 100 -gate
      - go run ./cmd/pop-cluster -blocks 20
      - go run ./cmd/carrot-spec -check
      - go run ./cmd/pop-public-smoke -attackers 100 -gate
      - go run ./cmd/pop-soak -blocks 1100 -gate > /tmp/pop-soak.json
      - go run ./cmd/pop-round-chaos -blocks 240 -seed 42 -gate > /tmp/pop-round-chaos.json
      - go vet ./...
      - go build ./cmd/battlebunnywealth
      - go build ./cmd/pop-sim
      - go build ./cmd/pop-bootstrap-sim
      - go build ./cmd/pop-bootstrap-config
      - go build ./cmd/pop-fly-topology
      - go build ./cmd/pop-node
      - go build ./cmd/pop-cluster
      - go build ./cmd/carrot-spec
      - go build ./cmd/carrot-wallet
      - go build ./cmd/pop-public-smoke
      - go build ./cmd/pop-soak
      - go build ./cmd/pop-round-chaos
      - go build ./cmd/pop-checkpoint-compare
      - go build ./cmd/pop-network-evidence
      - go build ./cmd/pop-live-evidence
      - go build ./cmd/pop-review-freeze
